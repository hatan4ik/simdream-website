version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CodeQL refuses to run when init and analyze come from different releases.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - dependencies
      - security
