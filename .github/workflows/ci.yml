name: Verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Seed data and local-date helpers are time-zone sensitive; match the test harness.
  TZ: Asia/Jerusalem

jobs:
  quality:
    name: Typecheck and hygiene, Vitest (unit · integration · security · reliability), audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # GENESIS.md must keep covering the codebase and retain a reviewed source fingerprint.
      - run: npm run docs:verify
      - name: Vitest with coverage ratchet
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-vitest
          path: |
            test-results/vitest-junit.xml
            test-results/coverage/
          if-no-files-found: ignore

  build:
    name: Sandboxed production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # All external secrets blank, so the build can never embed real keys.
      - run: npm run test:build
      # The client-bundle secrets scan needs a production build, which only this job has
      # (the quality job runs Vitest without building, where the scan skips).
      - name: Scan the client bundle for server-only names and secrets
        run: npx vitest run --project security tests/security/secrets-hygiene.test.ts
        env:
          REQUIRE_CLIENT_BUNDLE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next-test
            !.next-test/cache
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          PW_PORT: 3801
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-e2e-${{ matrix.project }}
          path: |
            test-results/playwright-junit-3801.xml
            playwright-report-3801/
            test-results/playwright-3801/
          if-no-files-found: ignore

  web-quality:
    name: Accessibility, usability, security-web, resilience, visual
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=a11y --project=usability --project=security-web --project=resilience
        env:
          PW_PORT: 3802
      # Compares against the committed Linux baselines (npm run test:visual:update).
      - run: npx playwright test --project=visual
        if: always()
        env:
          PW_PORT: 3803
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-web-quality
          path: |
            test-results/playwright-junit-3802.xml
            test-results/playwright-junit-3803.xml
            playwright-report-3802/
            playwright-report-3803/
            test-results/playwright-3802/
            test-results/playwright-3803/
          if-no-files-found: ignore

  load-smoke:
    name: Load smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next-test
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-load
          path: test-results/load-smoke.json
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budgets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps chromium
      # @lhci/cli runs through a pinned npx so its dependency tree stays out of the lockfile.
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-lighthouse
          path: tests/perf/reports/
          if-no-files-found: ignore

  report:
    name: Quality report
    needs: [quality, e2e, web-quality, load-smoke, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: test-results
          merge-multiple: true
      # Writes test-results/quality-report.md and the job summary.
      - run: npm run test:report

  wix-preview:
    name: Wix immutable preview
    # Every accepted main commit receives its own testable Wix URL. Pull requests
    # deliberately never receive the Wix credential, including forked PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WIX_PREVIEW_CI_ENABLED == 'true'
    needs: [quality, build, e2e, web-quality, load-smoke, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: wix-preview
      url: ${{ steps.wix.outputs.url }}
    concurrency:
      group: wix-preview-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate the Wix CLI with the environment-scoped automation key
        env:
          WIX_CI_API_KEY: ${{ secrets.WIX_CI_API_KEY }}
        run: |
          test -n "$WIX_CI_API_KEY" || { echo 'Missing wix-preview WIX_CI_API_KEY secret.' >&2; exit 1; }
          npx @wix/cli@latest login --api-key "$WIX_CI_API_KEY"
      - name: Build the exact Wix Worker artifact for this commit
        run: |
          set -o pipefail
          npm run wix:build | tee wix-build.log
      - name: Create the immutable Wix preview
        id: wix
        run: |
          set -o pipefail
          CI=1 npx @wix/cli@latest preview | tee wix-deploy.log
          url="$(tr -d '\r' < wix-deploy.log | grep -Eo 'https://[^[:space:]]+' | grep 'wix-site-host\.com' | tail -n 1 || true)"
          test -n "$url" || { echo 'Wix preview succeeded but no Wix-host URL was found in its output.' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Wix preview"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the deployed preview
        env:
          SITE_URL: ${{ steps.wix.outputs.url }}
        run: |
          for path in / /book /vouchers; do
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$SITE_URL$path" > /dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wix-preview-${{ github.sha }}
          path: |
            wix-build.log
            wix-deploy.log
          if-no-files-found: ignore

  wix-production-release:
    name: Publish approved Wix release
    # A release is a verified, immutable SemVer tag. The production environment
    # supplies its own secret and must be protected in the GitHub UI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.WIX_PRODUCTION_CI_ENABLED == 'true'
    needs: [quality, build, e2e, web-quality, load-smoke, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: wix-production
      url: ${{ steps.wix.outputs.url }}
    concurrency:
      group: wix-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify the release tag belongs to main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || { echo 'Use a SemVer tag such as v1.4.0.' >&2; exit 1; }
          release_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$release_sha" origin/main || { echo 'Release tags must reference a commit already on main.' >&2; exit 1; }
      - run: npm ci
      - name: Authenticate the Wix CLI with the production automation key
        env:
          WIX_CI_API_KEY: ${{ secrets.WIX_CI_API_KEY }}
        run: |
          test -n "$WIX_CI_API_KEY" || { echo 'Missing wix-production WIX_CI_API_KEY secret.' >&2; exit 1; }
          npx @wix/cli@latest login --api-key "$WIX_CI_API_KEY"
      - name: Build the exact Wix Worker artifact for this release
        run: |
          set -o pipefail
          npm run wix:build | tee wix-build.log
      - name: Publish to Wix
        id: wix
        run: |
          set -o pipefail
          CI=1 npx @wix/cli@latest release --comment "${GITHUB_REF_NAME} @ ${GITHUB_SHA}" | tee wix-deploy.log
          url="$(tr -d '\r' < wix-deploy.log | grep -Eo 'https://[^[:space:]]+' | grep 'wix-site-host\.com' | tail -n 1 || true)"
          test -n "$url" || { echo 'Wix release succeeded but no Wix-host URL was found in its output.' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Wix production release"
            echo "- Version: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the published site
        env:
          SITE_URL: ${{ steps.wix.outputs.url }}
        run: |
          for path in / /book /vouchers; do
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$SITE_URL$path" > /dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wix-production-${{ github.ref_name }}
          path: |
            wix-build.log
            wix-deploy.log
          if-no-files-found: ignore
