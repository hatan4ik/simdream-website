name: Verify

on:
  # Release Please candidates are normal same-repository pull requests. Their
  # release-integrity job below proves they only contain generated versioning
  # files and inherit a verified main parent, so they receive fresh fast gates
  # without replaying browser suites already run on the application source.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # @wix/cli 1.2.9 requires Node 24.22.1 or newer. Keep the product gate and
  # its immutable Wix preview on the same supported runtime.
  NODE_VERSION: 24
  # Pin this executable: it receives the environment-scoped Wix deployment key.
  WIX_CLI_VERSION: 1.2.9
  # Seed data and local-date helpers are time-zone sensitive; match the test harness.
  TZ: Asia/Jerusalem

jobs:
  release-integrity:
    name: Release source inheritance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.classify.outputs.fast_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify and verify the source lineage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_BRANCH: release-please--branches--main--components--simdream-website
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fast_path=false
          base_sha=''
          source=''

          if test "$GITHUB_EVENT_NAME" = 'pull_request' && test "$GITHUB_HEAD_REF" = "$RELEASE_BRANCH"; then
            test "$BASE_REF" = 'main' || { echo "Release candidate base must be main, got $BASE_REF" >&2; exit 1; }
            test -n "$BASE_SHA" || { echo 'Release candidate has no base SHA.' >&2; exit 1; }
            base_sha="$BASE_SHA"
            source='generated Release Please pull request'
          elif test "$GITHUB_EVENT_NAME" = 'push' && test "$GITHUB_REF" = 'refs/heads/main'; then
            case "$(git log -1 --format=%s)" in
              'chore(main): release '*) ;;
              *)
                echo 'fast_path=false' >> "$GITHUB_OUTPUT"
                echo 'Normal source change: complete browser quality matrix required.' >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
            # The exact title is deliberately not used as a trust boundary. It
            # merely selects the fast path; the allowed-file diff and verified
            # parent checks below make the decision fail closed.
            base_sha="$(git rev-parse HEAD^)"
            source='merged generated Release Please commit'
          fi

          if test -z "$source"; then
            echo 'fast_path=false' >> "$GITHUB_OUTPUT"
            echo 'Normal source change: complete browser quality matrix required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r changed_path; do
            case "$changed_path" in
              .release-please-manifest.json|CHANGELOG.md|package.json|package-lock.json) ;;
              *) echo "Unexpected file in generated release diff: $changed_path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$base_sha...HEAD")

          verify_url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&status=completed&head_sha=${base_sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Verify" and .conclusion == "success" and .event == "push" and .head_branch == "main") | .html_url][0] // empty')"
          test -n "$verify_url" || { echo "No successful main Verify run attests parent $base_sha." >&2; exit 1; }

          echo 'fast_path=true' >> "$GITHUB_OUTPUT"
          {
            echo '### Generated release lineage accepted'
            echo
            echo "- Source: $source"
            echo "- Verified parent: \`$base_sha\`"
            echo "- Parent Verify: $verify_url"
            echo '- Fresh lint, unit/security/audit, production-build and secret checks still run; browser, visual, load and Lighthouse suites are inherited from the verified application source.'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Typecheck and hygiene, Vitest (unit · integration · security · reliability), audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # GENESIS.md must keep covering the codebase and retain a reviewed source fingerprint.
      - run: npm run docs:verify
      - name: Vitest with coverage ratchet
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-vitest
          path: |
            test-results/vitest-junit.xml
            test-results/coverage/
          if-no-files-found: ignore

  secret-scan:
    name: Git history secret scan
    # The pinned action scans the changes introduced by each event. Generated
    # release candidates scan their small allowed diff too; the independent
    # historical audit owns full-history remediation.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Fetch the complete graph so Gitleaks can inspect the exact event range
      # reliably. The separate historical audit owns all-history remediation.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
  build:
    name: Sandboxed production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # All external secrets blank, so the build can never embed real keys.
      - run: npm run test:build
      # The client-bundle secrets scan needs a production build, which only this job has
      # (the quality job runs Vitest without building, where the scan skips).
      - name: Scan the client bundle for server-only names and secrets
        run: npx vitest run --project security tests/security/secrets-hygiene.test.ts
        env:
          REQUIRE_CLIENT_BUNDLE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: next-build
          path: |
            .next-test
            !.next-test/cache
          include-hidden-files: true
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.project }})
    needs: [build, release-integrity]
    if: needs.release-integrity.outputs.fast_path != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shared suite exercises both booking GUIs, including the optional
          # desktop-only Express Shop. It belongs on desktop engines only.
          - { project: chromium, browser: chromium, test_path: tests/e2e }
          - { project: firefox, browser: firefox, test_path: tests/e2e }
          - { project: webkit, browser: webkit, test_path: tests/e2e }
          # Phone customers have a deliberately different product surface: Guided
          # Wizard only, navigation drawer, sticky utility controls and safe-area
          # behaviour. Run its dedicated touch journey rather than asserting that
          # a hidden desktop storefront is visible.
          - { project: mobile-chrome, browser: chromium, test_path: tests/e2e/mobile.spec.ts }
          - { project: mobile-safari, browser: webkit, test_path: tests/e2e/mobile.spec.ts }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test ${{ matrix.test_path }} --project=${{ matrix.project }}
        env:
          PW_PORT: 3801
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-e2e-${{ matrix.project }}
          path: |
            test-results/playwright-junit-3801.xml
            playwright-report-3801/
            test-results/playwright-3801/
          if-no-files-found: ignore

  web-quality:
    name: Accessibility, usability, security-web, resilience, visual
    needs: [build, release-integrity]
    if: needs.release-integrity.outputs.fast_path != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=a11y --project=usability --project=security-web --project=resilience
        env:
          PW_PORT: 3802
      # Compares against the committed Linux baselines (npm run test:visual:update).
      - run: npx playwright test --project=visual
        if: always()
        env:
          PW_PORT: 3803
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-web-quality
          path: |
            test-results/playwright-junit-3802.xml
            test-results/playwright-junit-3803.xml
            playwright-report-3802/
            playwright-report-3803/
            test-results/playwright-3802/
            test-results/playwright-3803/
          if-no-files-found: ignore

  load-smoke:
    name: Load smoke
    needs: [build, release-integrity]
    if: needs.release-integrity.outputs.fast_path != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next-test
      - run: npm run test:load
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-load
          path: test-results/load-smoke.json
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budgets
    needs: [build, release-integrity]
    if: needs.release-integrity.outputs.fast_path != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: next-build
          path: .next-test
      - run: npx playwright install --with-deps chromium
      # @lhci/cli runs through a pinned npx so its dependency tree stays out of the lockfile.
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: results-lighthouse
          path: tests/perf/reports/
          if-no-files-found: ignore

  report:
    name: Quality report
    needs: [release-integrity, quality, secret-scan, build, e2e, web-quality, load-smoke, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: results-*
          path: test-results
          merge-multiple: true
      - name: Fail closed if any required verification gate failed
        env:
          RELEASE_INTEGRITY: ${{ needs.release-integrity.result }}
          QUALITY: ${{ needs.quality.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          WEB_QUALITY: ${{ needs.web-quality.result }}
          LOAD_SMOKE: ${{ needs.load-smoke.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail
          for gate in "$RELEASE_INTEGRITY" "$QUALITY" "$SECRET_SCAN" "$BUILD" "$E2E" "$WEB_QUALITY" "$LOAD_SMOKE" "$LIGHTHOUSE"; do
            case "$gate" in
              failure|cancelled) echo "A verification gate did not pass: $gate" >&2; exit 1 ;;
            esac
          done
      # Writes test-results/quality-report.md and the job summary.
      - run: npm run test:report

  wix-preview:
    name: Wix immutable preview
    # Every accepted main commit receives its own testable Wix URL. Pull requests
    # deliberately never receive the Wix credential, including forked PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-integrity.outputs.fast_path != 'true' && vars.WIX_PREVIEW_CI_ENABLED == 'true'
    needs: [release-integrity, quality, secret-scan, build, e2e, web-quality, load-smoke, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
    environment:
      name: wix-preview
      url: ${{ steps.wix.outputs.url }}
    concurrency:
      group: wix-preview-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate the Wix CLI with the environment-scoped automation key
        env:
          WIX_CI_API_KEY: ${{ secrets.WIX_CI_API_KEY }}
        run: |
          test -n "$WIX_CI_API_KEY" || { echo 'Missing wix-preview WIX_CI_API_KEY secret.' >&2; exit 1; }
          npx --yes @wix/cli@${WIX_CLI_VERSION} login --api-key "$WIX_CI_API_KEY"
      - name: Build the exact Wix Worker artifact for this commit
        run: |
          set -o pipefail
          npm run wix:build | tee wix-build.log
      - name: Create the immutable Wix preview
        id: wix
        run: |
          set -o pipefail
          CI=1 npx --yes @wix/cli@${WIX_CLI_VERSION} preview | tee wix-deploy.log
          # Wix formats the preview URL as `(https://…wix-site-host.com)`.
          # Match the hostname itself so terminal punctuation never becomes part
          # of SITE_URL and causes a false-negative smoke check.
          url="$(tr -d '\r' < wix-deploy.log | grep -Eo 'https://[[:alnum:].-]+\.wix-site-host\.com' | tail -n 1 || true)"
          test -n "$url" || { echo 'Wix preview succeeded but no Wix-host URL was found in its output.' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Wix preview"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the deployed preview
        env:
          SITE_URL: ${{ steps.wix.outputs.url }}
        run: |
          # The CLI acknowledges upload before Wix's route mapping has finished
          # propagating. A new preview can temporarily return Wix's own 404 page;
          # wait up to 150 seconds, but still fail closed if the app never serves.
          for path in / /book /vouchers; do
            curl --fail --location --retry 30 --retry-delay 5 --retry-all-errors --silent --show-error "$SITE_URL$path" > /dev/null
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wix-preview-${{ github.sha }}
          path: |
            wix-build.log
            wix-deploy.log
          if-no-files-found: ignore
