name: Publish released Wix frontend

on:
  repository_dispatch:
    types: [simdream-release-created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SimDream SemVer tag to verify and publish
        required: true
        type: string
      release_sha:
        description: Commit SHA recorded by the release (optional; checked when supplied)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: wix-production
  cancel-in-progress: false

env:
  # @wix/cli 1.2.9 requires Node 24.22.1 or newer.
  NODE_VERSION: 24
  WIX_CLI_VERSION: 1.2.9
  TZ: Asia/Jerusalem

jobs:
  verify-release:
    name: Verify immutable release provenance and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
      EXPECTED_SHA: ${{ github.event.client_payload.release_sha || inputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify release provenance and SemVer
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo 'Release tag must be SemVer, for example v1.4.0.' >&2
            exit 1
          }
          git fetch origin main --depth=1
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -z "$EXPECTED_SHA" || test "$release_sha" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo 'Release tag must reference a commit already on main.' >&2
            exit 1
          }
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_TAG#v}" || {
            echo 'package.json version must equal the release tag.' >&2
            exit 1
          }
      # Release Please only dispatches this workflow after a successful push
      # Verify run. Check that relationship again here so a manual dispatch
      # cannot publish an untested tag. The full browser suite is owned by
      # Verify, whose jobs install the pinned Playwright runtimes.
      - name: Require a successful Verify run for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          verified_run_url="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&status=completed&head_sha=${release_sha}&per_page=100" \
              | jq -r --arg sha "$release_sha" '
                [
                  .workflow_runs[]
                  | select(
                      .name == "Verify" and
                      .conclusion == "success" and
                      .event == "push" and
                      .head_branch == "main" and
                      .head_sha == $sha
                    )
                  | .html_url
                ][0] // empty
              '
          )"
          test -n "$verified_run_url" || {
            echo 'No successful Verify workflow run exists for this exact main commit.' >&2
            exit 1
          }
          {
            echo '### Immutable quality attestation'
            echo "- Verify run: $verified_run_url"
            echo "- Release commit: \`$release_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      # Recheck the deterministic source and production-build guards on the
      # checked-out tag. This is deliberately fast: the full browser, visual,
      # load and Lighthouse matrix already passed in the exact Verify run above.
      - name: Re-run deterministic source and build guards for the exact tag
        run: |
          npm run test:quick
          npm run test:build

  publish:
    name: Publish approved Wix release
    needs: verify-release
    if: vars.WIX_PRODUCTION_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: wix-production
      url: ${{ steps.wix.outputs.url }}
    env:
      RELEASE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Authenticate the Wix CLI with the production automation key
        env:
          WIX_CI_API_KEY: ${{ secrets.WIX_CI_API_KEY }}
        run: |
          test -n "$WIX_CI_API_KEY" || { echo 'Missing wix-production WIX_CI_API_KEY secret.' >&2; exit 1; }
          npx --yes @wix/cli@${WIX_CLI_VERSION} login --api-key "$WIX_CI_API_KEY"
      - name: Build the exact Wix Worker artifact for this release
        run: |
          set -o pipefail
          npm run wix:build | tee wix-build.log
      - name: Publish to Wix
        id: wix
        run: |
          set -o pipefail
          CI=1 npx --yes @wix/cli@${WIX_CLI_VERSION} release --comment "$RELEASE_TAG @ ${GITHUB_SHA}" | tee wix-deploy.log
          # Match a valid Wix hostname, excluding any CLI formatting punctuation.
          url="$(tr -d '\r' < wix-deploy.log | grep -Eo 'https://[[:alnum:].-]+\.wix-site-host\.com' | tail -n 1 || true)"
          test -n "$url" || { echo 'Wix release succeeded but no Wix-host URL was found in its output.' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Wix production release"
            echo "- Version: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the published site
        env:
          SITE_URL: ${{ steps.wix.outputs.url }}
        run: |
          # A Wix route can briefly return its platform 404 while a release
          # propagates. Wait up to 150 seconds without accepting a bad route.
          for path in / /book /vouchers; do
            curl --fail --location --retry 30 --retry-delay 5 --retry-all-errors --silent --show-error "$SITE_URL$path" > /dev/null
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wix-production-${{ github.event.client_payload.release_tag || inputs.release_tag }}
          path: |
            wix-build.log
            wix-deploy.log
          if-no-files-found: ignore
