name: Prepare semantic release

on:
  # A release proposal is created only after the exact main commit has passed
  # the complete Verify workflow. workflow_run also avoids accidental releases
  # from PRs and from GitHub Actions' own tag/release events.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release PR or publish approved release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - id: verified-tip
        name: Confirm Verify covered the current main tip
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'main advanced after Verify; the newer commit will receive its own release evaluation.' >&2
          fi
      - id: release
        if: steps.verified-tip.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Set up Node for the generated release ledger
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Generate the release ledger in the release candidate
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          case "$release_branch" in
            release-please--branches--main--components--simdream-website) ;;
            *) echo "Unexpected Release Please branch: $release_branch" >&2; exit 1 ;;
          esac
          git fetch origin "$release_branch"
          git checkout --detach "origin/$release_branch"
          npm ci
          npm run releases:generate
          if git diff --quiet -- RELEASES.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASES.md
          git commit -m 'chore(main): generate release ledger'
          git push origin HEAD:"$release_branch"
      # GitHub marks this GITHUB_TOKEN-generated pull-request workflow
      # `action_required` before it starts any jobs. Approve that one
      # PR-attached run instead of dispatching a detached duplicate, so branch
      # protection sees the fast inherited-release verification on the PR.
      - name: Approve the generated release candidate Verify run
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          case "$release_branch" in
            release-please--branches--main--components--simdream-website) ;;
            *) echo "Unexpected Release Please branch: $release_branch" >&2; exit 1 ;;
          esac
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_branch}" --jq '.object.sha')"
          for attempt in $(seq 1 20); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&status=completed&head_sha=${release_sha}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "Verify" and .conclusion == "action_required") | .id][0] // empty')"
            if test -n "$run_id"; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" > /dev/null
              echo "Approved PR-attached Verify run ${run_id}."
              exit 0
            fi
            sleep 3
          done
          echo 'Generated release candidate Verify run never entered action_required.' >&2
          exit 1
      # Tags created with GITHUB_TOKEN do not emit a push workflow. GitHub
      # explicitly permits repository_dispatch to start a separate workflow,
      # where the tag is rebuilt and fully verified before Wix can deploy it.
      - name: Dispatch the released tag to the protected Wix pipeline
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='simdream-release-created' \
            -f "client_payload[release_tag]=$RELEASE_TAG" \
            -f "client_payload[release_sha]=$RELEASE_SHA"
