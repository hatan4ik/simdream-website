name: Prepare semantic release

on:
  # A release proposal is created only after the exact main commit has passed
  # the complete Verify workflow. workflow_run also avoids accidental releases
  # from PRs and from GitHub Actions' own tag/release events.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release PR or publish approved release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: verified-tip
        name: Confirm Verify covered the current main tip
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'main advanced after Verify; the newer commit will receive its own release evaluation.' >&2
          fi
      - id: release
        if: steps.verified-tip.outputs.current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Set up Node for the generated release ledger
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Generate the release ledger in the release candidate
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          case "$release_branch" in
            release-please--branches--main--components--simdream-website) ;;
            *) echo "Unexpected Release Please branch: $release_branch" >&2; exit 1 ;;
          esac
          git fetch origin "$release_branch"
          git checkout --detach "origin/$release_branch"
          npm ci
          npm run releases:generate
          if git diff --quiet -- RELEASES.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASES.md
          git commit -m 'chore(main): generate release ledger'
          git push origin HEAD:"$release_branch"
      # GitHub marks GITHUB_TOKEN-generated pull-request workflows
      # `action_required` before they start. Cancel stale runs from earlier commits
      # on the release branch (so a delayed manual approval can never trigger the
      # shared PR concurrency group to cancel HEAD), then approve both `Verify`
      # and `PR mergeability preflight` for the final ledger commit.
      - name: Approve the generated release candidate Verify and preflight runs
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          release_branch="$(jq -er '.headBranchName' <<< "$RELEASE_PR")"
          case "$release_branch" in
            release-please--branches--main--components--simdream-website) ;;
            *) echo "Unexpected Release Please branch: $release_branch" >&2; exit 1 ;;
          esac
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_branch}" --jq '.object.sha')"

          stale_ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${release_branch}&per_page=50" \
            --jq "[.workflow_runs[] | select(.head_sha != \"${release_sha}\" and (.status != \"completed\" or .conclusion == \"action_required\")) | .id] | .[]")"
          for stale_id in $stale_ids; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${stale_id}/cancel" > /dev/null 2>&1 \
              || gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${stale_id}/force-cancel" > /dev/null 2>&1 \
              || true
            echo "Cancelled superseded release candidate run ${stale_id}."
          done

          approved_verify=false
          approved_preflight=false
          for attempt in $(seq 1 20); do
            runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${release_sha}&per_page=50")"
            action_ids="$(jq -r '[.workflow_runs[] | select((.name == "Verify" or .name == "PR mergeability preflight" or .name == "CodeQL") and .conclusion == "action_required") | "\(.id):\(.name)"] | .[]' <<< "$runs_json")"
            while IFS= read -r entry; do
              test -n "$entry" || continue
              run_id="${entry%%:*}"
              run_name="${entry#*:}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" > /dev/null || true
              echo "Approved PR-attached ${run_name} run ${run_id}."
            done <<< "$action_ids"

            verify_state="$(jq -r '[.workflow_runs[] | select(.name == "Verify") | (.conclusion // .status)][0] // ""' <<< "$runs_json")"
            preflight_state="$(jq -r '[.workflow_runs[] | select(.name == "PR mergeability preflight") | (.conclusion // .status)][0] // ""' <<< "$runs_json")"
            if test -n "$verify_state" && test "$verify_state" != 'action_required'; then
              approved_verify=true
            fi
            if test -n "$preflight_state" && test "$preflight_state" != 'action_required'; then
              approved_preflight=true
            fi
            if test "$approved_verify" = 'true' && test "$approved_preflight" = 'true'; then
              exit 0
            fi
            sleep 3
          done
          test "$approved_verify" = 'true' && exit 0
          echo 'Generated release candidate Verify run never left action_required.' >&2
          exit 1
      # Tags created with GITHUB_TOKEN do not emit a push workflow. GitHub
      # explicitly permits repository_dispatch to start a separate workflow,
      # where the tag is rebuilt and fully verified before Wix can deploy it.
      - name: Dispatch the released tag to the protected Wix pipeline
        if: steps.verified-tip.outputs.current == 'true' && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='simdream-release-created' \
            -f "client_payload[release_tag]=$RELEASE_TAG" \
            -f "client_payload[release_sha]=$RELEASE_SHA"
